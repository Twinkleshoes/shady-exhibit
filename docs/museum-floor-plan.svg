ont-size="28" fill="#273941" font-family="Arial,sans-serif">HISTORY</text><text x="700" y="640" text-anchor="middle" font-size="29" fill="#273941" font-family="Arial,sans-serif">CENTRAL ATRIUM</text><text x="700" y="1255" text-anchor="middle" font-size="20" fill="#273941" font-family="Arial,sans-serif">RECEPTION</text><text x="170" y="290" text-anchor="middle" font-size="20" fill="#273941" font-family="Arial,sans-serif">SCULPTURE STUDY</text><text x="1280" y="270" text-anchor="middle" font-size="20" fill="#273941" font-family="Arial,sans-serif">ORIGINS</text><text x="700" y="590" text-anchor="middle" font-size="20" fill="#273941" font-family="Arial,sans-serif">8.2m skylit hall</text><text x="700" y="780" text-anchor="middle" font-size="20" fill="#273941" font-family="Arial,sans-serif">Confluence</text><text x="560" y="1040" text-anchor="middle" font-size="19" fill="#273941" font-family="Arial,sans-serif">SECURITY</text><text x="560" y="1065" text-anchor="middle" font-size="19" fill="#273941" font-family="Arial,sans-serif">HOLDING</text><text x="855" y="1105" text-anchor="middle" font-size="20" fill="#273941" font-family="Arial,sans-serif">ESCAPE</text><text x="700" y="1290" text-anchor="middle" font-size="27" fill="#273941" font-family="Arial,sans-serif">SOUTH LOOP</text><text x="700" y="1370" text-anchor="middle" font-size="22" fill="#273941" font-family="Arial,sans-serif">MAIN ENTRANCE</text></g><text x="1370" y="210" text-anchor="start" font-size="23" fill="#2d5059" font-family="Arial,sans-serif">CIRCULATION</text><text x="1370" y="248" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Nine generous doorways connect the atrium,</text><text x="1370" y="276" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">three galleries, intro bays and south passage.</text><text x="1370" y="304" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Both loops bypass the atrium. Building unchanged.</text><text x="1370" y="379" text-anchor="start" font-size="23" fill="#2d5059" font-family="Arial,sans-serif">1 · ROYAL SAPPHIRE</text><text x="1370" y="417" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Gem Gallery: display cases and velvet ropes.</text><text x="1370" y="445" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Bodies stop at ropes; the shadow reaches through.</text><text x="1370" y="520" text-anchor="start" font-size="23" fill="#2d5059" font-family="Arial,sans-serif">2 · BRONZE SUN</text><text x="1370" y="558" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Sculpture Gallery: offset solid plinths.</text><text x="1370" y="586" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Approach from the south for a clear shadow angle.</text><text x="1370" y="661" text-anchor="start" font-size="23" fill="#2d5059" font-family="Arial,sans-serif">3 · IMPERIAL SEAL</text><text x="1370" y="699" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">History Gallery: staggered cabinets / partitions.</text><text x="1370" y="727" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Find the eastward approach between solid exhibits.</text><text x="1370" y="802" text-anchor="start" font-size="23" fill="#2d5059" font-family="Arial,sans-serif">SECURITY</text><text x="1370" y="840" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Six fixed cameras with saved ±50° pan.</text><text x="1370" y="868" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Blue arrows show default camera directions.</text><text x="1370" y="896" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Solid exhibits create deliberate blind spots.</text><text x="1370" y="971" text-anchor="start" font-size="23" fill="#2d5059" font-family="Arial,sans-serif">KEY</text><text x="1370" y="1009" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Gold diamond: treasure · cream circle: movable lamp</text><text x="1370" y="1037" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Orange square: jammer · purple square: rescue</text><text x="1370" y="1065" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Green zone: escape · dashed ring: open doorway</text><text x="1370" y="1093" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Grey-green block: movable display</text><text x="1370" y="1121" text-anchor="start" font-size="17" fill="#5b6769" font-family="Arial,sans-serif">Walls and exhibits match the actual server map.</text><text x="60" y="1500" text-anchor="start" font-size="20" fill="#637176" font-family="Arial,sans-serif">Architecture / arrangement pass · v0.3.0 · Layout overview generated from the shipped map definitions</text></svg>